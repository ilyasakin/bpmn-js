<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>bpmn-xyflow React demo</title>
  <style>
    html, body, #root { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .toolbar { padding: 10px 14px; border-bottom: 1px solid #e6e6e6; background: #fff; display: flex; gap: 10px; align-items: center; }
    .toolbar button, .toolbar select { font-size: 13px; padding: 4px 10px; }
    .toolbar .spacer { flex: 1; }
    .toolbar .info { font-size: 12px; color: #666; }
    .viewer-host { flex: 1; background: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.jsx"></script>

</html>
