<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>bpmn-xyflow viewer demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      padding: 10px 14px;
      border-bottom: 1px solid #e6e6e6;
      background: #fff;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar button,
    .toolbar select,
    .toolbar input[type=file] {
      font-size: 13px;
      padding: 4px 10px;
    }

    .toolbar .spacer {
      flex: 1;
    }

    .toolbar .info {
      font-size: 12px;
      color: #666;
    }

    #viewer {
      flex: 1;
      background: #fff;
      cursor: grab;
    }

    #viewer:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <select id="sample-select"></select>
      <input type="file" id="file-input" accept=".bpmn,.xml" />
      <button id="fit-view">Fit view</button>
      <button id="reset-zoom">Reset zoom</button>
      <span class="spacer"></span>
      <span class="info" id="status"></span>
    </div>
    <div id="viewer"></div>
  </div>
  <script src="./demo.bundle.js"></script>
</body>
</html>
